# The three series, timed: the same tests each time, a different harness under them. A job is one
# comparison — two harnesses run in turns on one machine — because the same harness on two of
# GitHub's machines differs by more than most of the changes are worth. The tables in the run's
# summary are made of those comparisons.
name: speedrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparisons:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: list
        run: echo "list=$(python speedrun.py --matrix)" >> "$GITHUB_OUTPUT"

  measure:
    needs: comparisons
    name: ${{ matrix.pair.b }} / ${{ matrix.pair.a }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.comparisons.outputs.list) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install what uv.lock names
        run: |
          pip install uv
          uv sync --frozen
      - name: The two harnesses, in turns
        env:
          SPEEDRUN_MACHINE: ${{ strategy.job-index }}
        run: |
          mkdir -p results
          uv run python speedrun.py "${{ matrix.pair.a }}" "${{ matrix.pair.b }}" --rounds "${{ matrix.pair.rounds }}" --json "results/${{ strategy.job-index }}.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: times-${{ strategy.job-index }}
          path: results/

  table:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true
      - name: The tables
        run: python scripts/summarize.py results/*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
