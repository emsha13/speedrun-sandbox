# Every harness of every series, timed: the same tests each time, a different harness under them.
# A harness is a job of its own, on a machine of its own, and runs several times there; the table
# in the run's summary is the median of each harness's runs.
name: speedrun

on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run every harness
        default: '3'

permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: list
        run: echo "list=$(python speedrun.py --matrix)" >> "$GITHUB_OUTPUT"

  measure:
    needs: harnesses
    name: ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.harnesses.outputs.list) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install what uv.lock names
        run: |
          pip install uv
          uv sync --frozen
      - name: Tests, timed
        run: |
          mkdir -p results
          uv run python speedrun.py "${{ matrix.harness }}" --runs "${{ inputs.runs }}" --json "results/${{ strategy.job-index }}.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: times-${{ strategy.job-index }}
          path: results/

  table:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true
      - name: The tables
        run: python scripts/summarize.py results/*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
